name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build self-contained application
        shell: cmd
        run: build-exe.cmd

      - name: Zip application
        shell: pwsh
        run: Compress-Archive -Path dist-exe/library-manager -DestinationPath dist-exe/library-manager-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-manager-windows
          path: dist-exe/library-manager-windows.zip
